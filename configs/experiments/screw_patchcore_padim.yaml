schema_version: 1
product_key: screw
dataset:
  root: datasets/products/screw_anomaly_full
  image_manifest: manifests/images.jsonl
  object_manifest: manifests/objects.jsonl
  split_policy: stratified_by_defect_type
models:
  detector:
    backend: yolo_obb
    weights: artifacts/products/screw/screw-supervised-dev-001/detector_dataset/training/run/weights/best.pt
    image_size: 1024
    calibration_path: artifacts/products/screw/screw-open-set-candidate-rnd1/detector_calibration.json
  product_recognizer:
    backend: gallery
    gallery_path: artifacts/products/screw/screw-recognizer-rnd6/gallery.pt
    calibration_path: artifacts/products/screw/screw-recognizer-rnd6/calibration.json
    encoder_artifact_root: artifacts/production/mvtec_ad
    device: mps
  classifier:
    backend: dinov2_patch_memory
    artifact_path: artifacts/products/screw/screw-patch-memory-rnd3/classifier_top1_allowed03.pt
    encoder_artifact_root: artifacts/production/mvtec_ad
    device: mps
    model_version: exact-knn-screw-patch-memory-rnd3
  localizer:
    backend: anomalyclip
    runner: scripts/run_anomalyclip_single.py
    repository: artifacts/external/anomalyclip
    checkpoint: artifacts/external/anomalyclip/checkpoints/9_12_4_multiscale/epoch_15.pth
    clip_cache: artifacts/external/clip
    calibration_path: artifacts/products/screw/screw-supervised-dev-002/anomalyclip_calibration.json
    mask_postprocess: raw
    supervised_refiner_path: artifacts/products/screw/screw-supervised-dev-003/supervised_refiner.pkl
    supervised_refiner_calibration_path: artifacts/products/screw/screw-supervised-dev-004/supervised_refiner_calibration.json
    supervised_refiner_enabled: true
    dino_artifact_root: artifacts/production/mvtec_ad
    device: mps
    model_version: anomalyclip-supervised-refiner-rnd4
  reporter:
    backend: mock
    async_enabled: true
policy:
  quality_labels: [GOOD, DEFECT]
  optimize_for: defect_recall
  target_defect_recall: 0.90
  calibration_path: artifacts/products/screw/screw-open-set-candidate-rnd1/policy_calibration.json
  model_bundle_version: screw-exact-knn-supervised-refiner-rnd4-candidate
outputs:
  overview: true
  per_object_status_crop: true
  heatmap_for_defect: true
  json: true
  compact_pdf: true
