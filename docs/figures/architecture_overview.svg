<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Image-first industrial inspection architecture</title>
  <desc id="desc">A product detector feeds an open-set gate and DINOv2 classifier. Defect and review objects receive localization evidence and an optional VLM report.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 z" fill="#344054"/></marker>
    <style>
      .box { stroke:#344054; stroke-width:2; rx:18; ry:18; }
      .title { font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#101828; }
      .label { font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#101828; }
      .small { font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475467; }
      .arrow { stroke:#344054; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dashed { stroke-dasharray:9 8; }
    </style>
  </defs>
  <rect width="1600" height="760" fill="#f8fafc"/>
  <text x="800" y="52" text-anchor="middle" class="title">Image-first Industrial Vision Inspection Platform</text>
  <text x="800" y="82" text-anchor="middle" class="small">The classifier owns GOOD/DEFECT; localization and VLM provide evidence but never silently override the decision.</text>

  <rect x="45" y="190" width="190" height="120" class="box" fill="#e0f2fe"/>
  <text x="140" y="235" text-anchor="middle" class="label">Input</text>
  <text x="140" y="267" text-anchor="middle" class="small">image / batch</text>
  <text x="140" y="292" text-anchor="middle" class="small">video later</text>

  <rect x="300" y="190" width="210" height="120" class="box" fill="#dbeafe"/>
  <text x="405" y="235" text-anchor="middle" class="label">YOLO-OBB</text>
  <text x="405" y="267" text-anchor="middle" class="small">detect instances</text>
  <text x="405" y="292" text-anchor="middle" class="small">or NO_DETECTION</text>

  <rect x="575" y="190" width="220" height="120" class="box" fill="#ede9fe"/>
  <text x="685" y="235" text-anchor="middle" class="label">Geometry</text>
  <text x="685" y="267" text-anchor="middle" class="small">OBB crop + mapping</text>
  <text x="685" y="292" text-anchor="middle" class="small">save provenance</text>

  <rect x="860" y="150" width="260" height="140" class="box" fill="#fef3c7"/>
  <text x="990" y="195" text-anchor="middle" class="label">Open-set gate</text>
  <text x="990" y="228" text-anchor="middle" class="small">DINOv2 GOOD gallery</text>
  <text x="990" y="253" text-anchor="middle" class="small">KNOWN / UNKNOWN</text>
  <text x="990" y="278" text-anchor="middle" class="small">unknown → review</text>

  <rect x="860" y="370" width="260" height="140" class="box" fill="#dcfce7"/>
  <text x="990" y="415" text-anchor="middle" class="label">DINOv2 classifier</text>
  <text x="990" y="448" text-anchor="middle" class="small">GOOD / DEFECT</text>
  <text x="990" y="473" text-anchor="middle" class="small">validation thresholds</text>
  <text x="990" y="498" text-anchor="middle" class="small">review band retained</text>

  <rect x="1210" y="150" width="300" height="140" class="box" fill="#fee2e2"/>
  <text x="1360" y="195" text-anchor="middle" class="label">Localization evidence</text>
  <text x="1360" y="228" text-anchor="middle" class="small">DINO spatial decoder</text>
  <text x="1360" y="253" text-anchor="middle" class="small">AnomalyCLIP auxiliary map</text>
  <text x="1360" y="278" text-anchor="middle" class="small">heatmap / mask / overlay</text>

  <rect x="1210" y="370" width="300" height="140" class="box" fill="#fce7f3"/>
  <text x="1360" y="415" text-anchor="middle" class="label">Reporting boundary</text>
  <text x="1360" y="448" text-anchor="middle" class="small">JSON + PDF + evidence</text>
  <text x="1360" y="473" text-anchor="middle" class="small">optional VLM for DEFECT</text>
  <text x="1360" y="498" text-anchor="middle" class="small">mock until provider configured</text>

  <path d="M235 250 H300" class="arrow"/>
  <path d="M510 250 H575" class="arrow"/>
  <path d="M795 250 H860" class="arrow"/>
  <path d="M990 290 V370" class="arrow"/>
  <path d="M1120 220 H1210" class="arrow"/>
  <path d="M1120 440 H1210" class="arrow"/>
  <path d="M1120 440 C1170 440 1160 220 1210 220" class="arrow dashed"/>
  <path d="M1510 440 H1570" class="arrow"/>

  <rect x="45" y="610" width="1465" height="85" class="box" fill="#ffffff"/>
  <text x="70" y="645" class="label">Operational states</text>
  <text x="70" y="675" class="small">GOOD = stop heavy processing · REVIEW_REQUIRED = retain evidence for human review · DEFECT = heatmap + report attempt · UNKNOWN_PRODUCT = never force a product label</text>
</svg>
